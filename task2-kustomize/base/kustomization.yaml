apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - redis-deployment.yaml
  - redis-service.yaml
  - web-deployment.yaml
  - web-service.yaml

# Базовый ConfigMap с "дефолтными" значениями. Оверлеи dev/prod
# переопределяют его через configMapGenerator + behavior: merge,
# то есть именно так Kustomize рекомендует параметризовать окружения
# без копипаста целых манифестов (в отличие от Helm values.yaml).
configMapGenerator:
  - name: flask-env-config
    literals:
      - APP_ENV=base
      - GREETING_MESSAGE=Hello from Kustomize Base
      - APP_COLOR=gray
