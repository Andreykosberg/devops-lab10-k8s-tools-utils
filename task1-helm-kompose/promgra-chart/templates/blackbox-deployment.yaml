apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --chart -f compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: blackbox
  name: blackbox
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: blackbox
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --chart -f compose.yaml
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: blackbox
    spec:
      containers:
        - image: prom/blackbox-exporter
          # Ручная правка: образ уже загружен в minikube через `minikube image load`.
          imagePullPolicy: Never
          name: blackbox
          ports:
            - containerPort: 9115
              protocol: TCP
      restartPolicy: Always
