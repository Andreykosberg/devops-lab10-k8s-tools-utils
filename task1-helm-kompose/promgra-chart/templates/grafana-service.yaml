apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert --chart -f compose.yaml
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  # Ручная правка (как на слайде 25 лекции): делаем Grafana доступной снаружи
  # ВМ через уже работающий `minikube tunnel --bind-address 10.0.2.15`.
  # kompose по умолчанию сгенерировал бы обычный ClusterIP.
  type: LoadBalancer
  externalIPs:
    - {{ .Values.EXTERNAL_IP | quote }}
  ports:
    - name: "3000"
      port: {{ .Values.EXTERNAL_PORT }}
      targetPort: 3000
  selector:
    io.kompose.service: grafana
